[project]
name = "trellis"
version = "0.1.0"
description = "A conversational external brain with visible Obsidian state"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.75,<1",
  # PINNED to the garth-token era: stored Garmin sessions are garth dumps (the
  # health worker reads with garth too). 0.3.x rewrote auth to DI tokens and cannot
  # load them — a rebuild silently broke push on 2 Aug 2026. Bump only deliberately,
  # with a migration plan for stored sessions.
  # that build_garmin_workout builds structured watch workouts on.
  "garminconnect==0.2.40",
  "pydantic>=2,<3",
  "groq>=0.29,<1",
  "psycopg2-binary>=2.9.10,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot[job-queue]>=22,<23",
  "onnxruntime==1.19.2",
  "fastembed>=0.3,<0.5",
]

[project.scripts]
trellis = "trellis.core_main:main"
trellis-garmin-setup = "trellis.infra_garmin:main_setup"
trellis-garmin-sync = "trellis.infra_garmin:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.14.2",
]
