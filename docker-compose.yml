name: trellis

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trellis
      # Your own, in .env, BEFORE the first start (Postgres fixes it when the volume
      # is created). There is no default — compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trellis
    # This machine only. The bot reaches Postgres over the compose network; the
    # published port is for local tools, never the LAN.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trellis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trellis -d trellis"]
      interval: 5s
      timeout: 5s
      retries: 10

  health-worker:
    build:
      context: ./services/health-worker
      dockerfile: Dockerfile
    env_file:
      - path: .env
        # required: a missing .env must fail HERE, not as opaque runtime
        # errors (empty bot token, 500ing health worker) far from the cause.
        required: true
    environment:
      PORT: 8001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3))['status'] == 'ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trellis:
    build: .
    env_file:
      - path: .env
        # required: a missing .env must fail HERE, not as opaque runtime
        # errors (empty bot token, 500ing health worker) far from the cause.
        required: true
    environment:
      # The app builds its connection from these parts, so the password is never
      # pasted into a URL. DATABASE_URL is blanked: a host-side one in .env must
      # not leak into the container.
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OBSIDIAN_VAULT: /vault
      HEALTH_WORKER_URL: http://health-worker:8001
    volumes:
      - ${OBSIDIAN_VAULT:-./vault}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      health-worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trellis_postgres:
